# More option see https://github.com/DreamMaoMao/mango/wiki/

# Electron/Chromium apps native Wayland (else XWayland on nvidia -> flicker)
env=NIXOS_OZONE_WL,1

exec-once=mako
exec-once=waybar
exec-once=awww-daemon & awww img /home/tagp/Downloads/wallpaper.png
exec-once=swayidle -w timeout 900 'wlopm --off \*' resume 'wlopm --on \*' timeout 1800 'systemctl hibernate'
# delay: wait for waybar's StatusNotifierWatcher (tray) before registering icon
exec-once=sleep 2 && easyeffects --hide-window --service-mode --load-preset headset-eq
exec-once=ghostty --class=startup.fetch -e bash -c "fastfetch; exec bash"

# Monitors
monitorrule=serial:A2RIC301805H,width:3440,height:1440,refresh:240,x:1440,y:500
monitorrule=serial:UK02548026832,width:2560,height:1440,refresh:120,x:0,y:0,rr:1
# Make: CORSAIR MEMORY Inc.
# Model: 45WQHD240
# Serial: A2RIC301805H
# Make: Philips Consumer Electronics Company
# Model: 27B2N3500J
# Serial: UK02548026832

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=10
no_radius_when_single=0
focused_opacity=0.9
unfocused_opacity=0.9

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=0
animation_fade_out=0
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
# Quick, determined slides — short durations, sharp ease-out, no overshoot/bounce.
animation_duration_move=180
animation_duration_open=160
animation_duration_tag=180
animation_duration_close=140
animation_duration_focus=0
animation_curve_open=0.16,1,0.3,1
animation_curve_move=0.16,1,0.3,1
animation_curve_tag=0.16,1,0.3,1
animation_curve_close=0.3,0,0.8,0.15
animation_curve_focus=0.16,1,0.3,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# center_tile: single window stays centered at mfact width (no full-screen spread)
center_master_overspread=0
center_when_single_stack=1

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=40
repeat_delay=300
numlockon=0
xkb_rules_layout=no
xkb_rules_variant=nodeadkeys

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=2
gappiv=2
gappoh=4
gappov=4
borderpx=0
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
#
# center_tile single centered window on ultrawide. mfact 0.45 of 3440 = ~1548px
tagrule=id:1,monitor_serial:A2RIC301805H,layout_name:center_tile,mfact:0.45
tagrule=id:2,monitor_serial:A2RIC301805H,layout_name:center_tile,mfact:0.45
tagrule=id:3,monitor_serial:A2RIC301805H,layout_name:center_tile,mfact:0.45
tagrule=id:4,monitor_serial:A2RIC301805H,layout_name:center_tile,mfact:0.45
tagrule=id:5,monitor_serial:A2RIC301805H,layout_name:center_tile,mfact:0.45
tagrule=id:6,monitor_serial:A2RIC301805H,layout_name:center_tile,mfact:0.45
tagrule=id:7,monitor_serial:A2RIC301805H,layout_name:center_tile,mfact:0.45
tagrule=id:8,monitor_serial:A2RIC301805H,layout_name:center_tile,mfact:0.45
tagrule=id:9,monitor_serial:A2RIC301805H,layout_name:center_tile,mfact:0.45
# side monitor (portrait, rr:1): vertical_tile = top/bottom logical split, which
# renders as left->right physically once rotated (= super+j once from tile).
# explicit so reload resets it; single window = full screen.
tagrule=id:1,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:2,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:3,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:4,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:5,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:6,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:7,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:8,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:9,monitor_serial:UK02548026832,layout_name:vertical_tile

# window rules
windowrule=appid:floating.volume,isfloating:1,width:900,height:600
windowrule=appid:startup.fetch,isfloating:1,width:1064,height:564
# spotify launches hidden into a named scratchpad; waybar music icon controls playback, toggle key reveals window
windowrule=appid:Spotify,isnamedscratchpad:1,width:1280,height:800

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,Return,spawn,ghostty

# kill process picker (rofi script modi, defined in configuration.nix)
bind=SUPER,k,spawn,rofi -show kill -modi "kill:rofi-kill"

# screenshot to clipboard (png, nothing saved to disk)
bind=none,Print,spawn,/home/tagp/.config/mango/scripts/screenshot-region.sh region
bind=shift,Print,spawn,/home/tagp/.config/mango/scripts/screenshot-region.sh full

# exit
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,v,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad
# reveal/hide spotify (named scratchpad); launches it hidden if not running
bind=SUPER,s,toggle_named_scratchpad,Spotify,none,spotify

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# toggle tile split orientation on focused monitor: left-right <-> top-bottom
bind=SUPER,j,spawn,/home/tagp/.config/mango/scripts/toggle-split.sh

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Alt,1,view,1,0
bind=Alt,2,view,2,0
bind=Alt,3,view,3,0
bind=Alt,4,view,4,0
bind=Alt,5,view,5,0
bind=Alt,6,view,6,0
bind=Alt,7,view,7,0
bind=Alt,8,view,8,0
bind=Alt,9,view,9,0

# # tag: move client to the tag and focus it
# # tagsilent: move client to the tag and not focus it
# # bind=Alt,1,tagsilent,1
# bind=,1,tag,1,0
# bind=Alt,2,tag,2,0
# bind=Alt,3,tag,3,0
# bind=Alt,4,tag,4,0
# bind=Alt,5,tag,5,0
# bind=Alt,6,tag,6,0
# bind=Alt,7,tag,7,0
# bind=Alt,8,tag,8,0
# bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
