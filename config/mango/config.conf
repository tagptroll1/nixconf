# Electron/Chromium apps native Wayland (else XWayland on nvidia -> flicker)
env=NIXOS_OZONE_WL,1

exec-once=mako
exec-once=waybar
# wallpaper: only this session needs it - the quickshell session draws its own
exec-once=awww-daemon & awww img /home/tagp/Downloads/wallpaper.png

source=./nvidia.conf
source=./monitors.conf
source=./window.conf
source=./layouts.conf
source=./animations.conf
source=./misc.conf
source=./keyboard.conf
source=./appearance.conf
source=./execonce.conf
source=./keybinds.conf

# menu and terminal
bind=SUPER,space,spawn,rofi -show drun

# kill process picker (rofi script modi, defined in configuration.nix)
bind=CTRL+ALT,Delete,spawn,rofi -show kill -modi "kill:rofi-kill"

# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
