# Stage Layout Setting
# A dragged window becomes a square card a quarter of the center square, drawn
# at max scale; off-stage it eases to min toward the monitor edge.
stage_scale_max=0.7
stage_scale_min=0.3
# Falloff shape from max to min: 1 eases evenly, under 1 shrinks sooner near
# the center (half the shrink done at curve/(1+curve) of the way out).
stage_scale_curve=0.4
# Off-stage windows are told they are this many times smaller than their card,
# so their text draws this much larger; 1 keeps plain scaling.
stage_text_zoom=1.5
# Within this many px of a side edge a card shrinks fast until its longest side
# is stage_dock_tiny at the mini zone, so the dock widget replaces something
# already that small. Undocked windows come back just outside this zone.
stage_shrink_zone=100
stage_dock_tiny=64
# Releasing a card with its side this close to the monitor edge docks it;
# within the mini zone it becomes the compact widget.
stage_dock_zone=48
stage_dock_mini_zone=8
# Overview dock strip width, as a share of the monitor.
stage_overview_dock_ratio=0.12
# Shaking a dragged window (this many direction flips, each at least travel px,
# all within window ms) pushes the others out to the side columns.
stage_shake_flips=4
stage_shake_travel=40
stage_shake_window_ms=800
