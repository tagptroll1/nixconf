# Electron/Chromium apps native Wayland (else XWayland on nvidia -> flicker)
env=NIXOS_OZONE_WL,1
# omarchy's shell.qml resolves plugins, default shell.json and the menu from here
env=OMARCHY_PATH,~/.config/omarchy

# -n so a stray second launch exits instead of stacking a second bar. shell.qml
# sits at the root of ~/.config/quickshell, so this is the default config.
exec-once=quickshell -n

source=./nvidia.conf
source=./monitors.conf
source=./window.conf
source=./layouts.conf
source=./animations.conf
source=./misc.conf
source=./keyboard.conf
source=./appearance.conf
source=./execonce.conf
source=./keybinds.conf

# No mako and no awww here: the shell is the notification server and draws the
# wallpaper on its own layer surface. swayidle (from execonce.conf) still owns
# blank and hibernate, so omarchy's idle and lock plugins are switched off in
# config/omarchy/config/omarchy/shell.json.

# menu and terminal. Same split as upstream: root menu on SUPER+space, the app
# launcher one level in on SUPER+CTRL+space and the theme selector on
# SUPER+CTRL+SHIFT+space. mango's spawn runs the command through wordexp(), so
# the JSON payload has to be single-quoted to survive quote removal.
bind=SUPER,space,spawn,qs ipc call shell toggle omarchy.menu '{}'
bind=SUPER+CTRL,space,spawn,qs ipc call shell toggle omarchy.menu '{"menu":"apps"}'
bind=SUPER+CTRL+SHIFT,space,spawn,qs ipc call shell toggle omarchy.menu '{"menu":"style.theme"}'

# No lock bind: SUPER+m (keybinds.conf) already quits mango back to the SDDM
# greeter, and its session picker is how you switch between this and mango-wl.

# Requires rofi, keep to reproduce in qs.
# kill process picker (rofi script modi, defined in configuration.nix)
# bind=SUPER,k,spawn,rofi -show kill -modi "kill:rofi-kill"

# layer rule
# layerrule=animation_type_open:zoom,layer_name:rofi
# layerrule=animation_type_close:zoom,layer_name:rofi
