
# Monitors
monitor_rule=serial:$mon_main,width:3440,height:1440,refresh:240,x:1440,y:500
monitor_rule=serial:$mon_side,width:2560,height:1440,refresh:120,x:0,y:0,rr:1

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller,dwindle
tag_rule=id:1,monitor_serial:$mon_main,layout_name:stage,master_factor:$stage_mfact
tag_rule=id:2,monitor_serial:$mon_main,layout_name:stage,master_factor:$stage_mfact
tag_rule=id:3,monitor_serial:$mon_main,layout_name:stage,master_factor:$stage_mfact
tag_rule=id:4,monitor_serial:$mon_main,layout_name:stage,master_factor:$stage_mfact
tag_rule=id:5,monitor_serial:$mon_main,layout_name:stage,master_factor:$stage_mfact
tag_rule=id:6,monitor_serial:$mon_main,layout_name:stage,master_factor:$stage_mfact
tag_rule=id:7,monitor_serial:$mon_main,layout_name:stage,master_factor:$stage_mfact
tag_rule=id:8,monitor_serial:$mon_main,layout_name:stage,master_factor:$stage_mfact
tag_rule=id:9,monitor_serial:$mon_main,layout_name:stage,master_factor:$stage_mfact
# side monitor (portrait, rr:1): vertical_tile = top/bottom logical split, which
# renders as left->right physically once rotated (= super+j once from tile).
# explicit so reload resets it; single window = full screen.
tag_rule=id:1,monitor_serial:$mon_side,layout_name:vertical_tile
tag_rule=id:2,monitor_serial:$mon_side,layout_name:vertical_tile
tag_rule=id:3,monitor_serial:$mon_side,layout_name:vertical_tile
tag_rule=id:4,monitor_serial:$mon_side,layout_name:vertical_tile
tag_rule=id:5,monitor_serial:$mon_side,layout_name:vertical_tile
tag_rule=id:6,monitor_serial:$mon_side,layout_name:vertical_tile
tag_rule=id:7,monitor_serial:$mon_side,layout_name:vertical_tile
tag_rule=id:8,monitor_serial:$mon_side,layout_name:vertical_tile
tag_rule=id:9,monitor_serial:$mon_side,layout_name:vertical_tile

# window rules
window_rule=app_id:floating.volume,is_floating:1,width:900,height:600
window_rule=app_id:floating.bluetooth,is_floating:1,width:900,height:600
window_rule=app_id:startup.fetch,is_floating:1,width:1064,height:564
# packages menu: sudo prompt, failed-build log, module editing
window_rule=app_id:floating.nixpass,is_floating:1,no_size_hint:1,width:620,height:250
window_rule=app_id:floating.nixbuild,is_floating:1,width:1200,height:800
window_rule=app_id:floating.nixedit,is_floating:1,width:1200,height:800
# craft apps run on Xwayland, so the portal can't parent their file dialogs and mango tiles them
window_rule=app_id:xdg-desktop-portal-gtk,is_floating:1
# librewolf picture-in-picture stays above everything, games included
window_rule=app_id:librewolf,title:^Picture-in-Picture$,is_floating:1,is_overlay:1
# spotify launches hidden into a named scratchpad; toggle key reveals window
window_rule=app_id:Spotify,is_named_scratchpad:1,width:1280,height:800
# keep idle inhibited while a steam game is focused, even muted
window_rule=idle_inhibit_when_focus:1,app_id:steam_app_.*
# native games keep own app_id, steam_app_.* only matches proton
window_rule=idle_inhibit_when_focus:1,app_id:factorio
# StS2 re-asserts its own size in fullscreen, kicking mango back out; ignore its hints
window_rule=app_id:steam_app_2868840,no_size_hint:1

# rules the app modules under modules/apps/ declare for their own windows;
# generated by modules/features/mango-rules.nix, absent until a rebuild writes it
source_optional=~/.config/mango-apps.conf
