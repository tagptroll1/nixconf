
# Monitors
monitorrule=serial:A2RIC301805H,width:3440,height:1440,refresh:240,x:1440,y:500
monitorrule=serial:UK02548026832,width:2560,height:1440,refresh:120,x:0,y:0,rr:1
# Make: CORSAIR MEMORY Inc.
# Model: 45WQHD240
# Serial: A2RIC301805H
# Make: Philips Consumer Electronics Company
# Model: 27B2N3500J
# Serial: UK02548026832

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller,dwindle
#
# center_tile single centered window on ultrawide. mfact 0.45 of 3440 = ~1548px
tagrule=id:1,monitor_serial:A2RIC301805H,layout_name:dwindle,mfact:0.45
tagrule=id:2,monitor_serial:A2RIC301805H,layout_name:dwindle,mfact:0.45
tagrule=id:3,monitor_serial:A2RIC301805H,layout_name:dwindle,mfact:0.45
tagrule=id:4,monitor_serial:A2RIC301805H,layout_name:dwindle,mfact:0.45
tagrule=id:5,monitor_serial:A2RIC301805H,layout_name:dwindle,mfact:0.45
tagrule=id:6,monitor_serial:A2RIC301805H,layout_name:dwindle,mfact:0.45
tagrule=id:7,monitor_serial:A2RIC301805H,layout_name:dwindle,mfact:0.45
tagrule=id:8,monitor_serial:A2RIC301805H,layout_name:dwindle,mfact:0.45
tagrule=id:9,monitor_serial:A2RIC301805H,layout_name:dwindle,mfact:0.45
# side monitor (portrait, rr:1): vertical_tile = top/bottom logical split, which
# renders as left->right physically once rotated (= super+j once from tile).
# explicit so reload resets it; single window = full screen.
tagrule=id:1,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:2,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:3,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:4,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:5,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:6,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:7,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:8,monitor_serial:UK02548026832,layout_name:vertical_tile
tagrule=id:9,monitor_serial:UK02548026832,layout_name:vertical_tile

# window rules
windowrule=appid:floating.volume,isfloating:1,width:900,height:600
windowrule=appid:floating.bluetooth,isfloating:1,width:900,height:600
windowrule=appid:startup.fetch,isfloating:1,width:1064,height:564
# packages menu: sudo prompt, failed-build log, module editing
windowrule=appid:floating.nixpass,isfloating:1,isnosizehint:1,width:620,height:250
windowrule=appid:floating.nixbuild,isfloating:1,width:1200,height:800
windowrule=appid:floating.nixedit,isfloating:1,width:1200,height:800
# spotify launches hidden into a named scratchpad; toggle key reveals window
windowrule=appid:Spotify,isnamedscratchpad:1,width:1280,height:800
# keep idle inhibited while a steam game is focused, even muted
windowrule=idleinhibit_when_focus:1,appid:steam_app_.*
# native games keep own appid, steam_app_.* only matches proton
windowrule=idleinhibit_when_focus:1,appid:factorio
# StS2 re-asserts its own size in fullscreen, kicking mango back out; ignore its hints
windowrule=appid:steam_app_2868840,isnosizehint:1

# rules the app modules under modules/apps/ declare for their own windows;
# generated by modules/features/mango-rules.nix, absent until a rebuild writes it
source-optional=~/.config/mango-apps.conf
