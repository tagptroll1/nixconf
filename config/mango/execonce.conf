# mango is not systemd-managed, so nothing pulls in graphical-session.target, and every
# xdg-desktop-portal unit is Requisite= on it - without this the portal never starts and
# file pickers and screenshare fail. mango-session.target (home.nix) binds to it; the env
# import is what xdg-desktop-portal-wlr conditions on.
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user start mango-session.target
exec-once=swayidle -w timeout 900 'wlopm --off \*' resume 'wlopm --on \*' timeout 1800 'systemctl hibernate'
# inhibit idle while media plays; wayland-protocol inhibitor (sway-audio-idle-inhibit used logind,
# which swayidle drops on release/retake flaps -> instant blank when already idle past timeout)
exec-once=wayland-pipewire-idle-inhibit -d 10
# delay: wait for waybar's StatusNotifierWatcher (tray) before registering icon
exec-once=sleep 2 && easyeffects --hide-window --service-mode --load-preset headset-eq
exec-once=ghostty --class=startup.fetch -e bash -c "fastfetch; exec bash"
